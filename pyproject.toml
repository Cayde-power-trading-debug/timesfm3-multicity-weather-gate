[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timesfm3-multicity-weather-gate"
version = "0.1.0"
description = "Leakage-safe city-isolated weather gating for multi-city load forecasting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Cayde-power-trading-debug"}]
keywords = ["timesfm", "load-forecasting", "weather", "multicity", "time-series"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[tool.setuptools.packages.find]
where = ["src"]
